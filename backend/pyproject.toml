[project]
name = "smf-backend"
version = "0.1.0"
description = "Backend API for semiconductor manufacturing yield optimization with AI-powered defect detection and root cause analysis"
authors = [{name = "Julian Boronat", email = "julian.boronat@mongodb.com"}]
requires-python = ">=3.10,<3.11"
dependencies = [
    "pymongo>=4.10.1",
    "motor>=3.3.2",
    "python-dotenv>=1.0.1",
    "fastapi>=0.115.4",
    "uvicorn>=0.32.0",
    "boto3>=1.35.70",
    "botocore>=1.35.70",
    "tqdm>=4.67.1",
    "pandas>=2.2.3",
    "numpy>=1.24.0",
    "Pillow>=10.0.0",
    "langchain-core>=0.3.0",
    "langchain-aws>=0.2.15",
    "langchain-mongodb>=0.5.0",
    "langgraph>=0.3.5",
    "grandalf>=0.8",
    "langgraph-checkpoint-mongodb>=0.1.1",
    "annotated-types>=0.7.0",
    "websockets>=12.0",
    "voyageai>=0.2.3",
    "aiohttp>=3.9.0",
    "websocket-client>=1.8.0",
    "langgraph-supervisor>=0.0.29",
    "langchain-anthropic>=0.3.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
