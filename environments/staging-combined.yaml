env:
  NODE_ENV: staging

  # Client-side API calls use Next.js proxy route (runs server-side)
  # The proxy route then uses INTERNAL_API_URL to reach backend via loopback
  NEXT_PUBLIC_API_URL: /api/backend

  # Server-side environment variables for Next.js API routes and rewrites
  # These use loopback because Next.js runs in the same pod as backend
  INTERNAL_API_URL: http://127.0.0.1:8000
  INTERNAL_WS_URL: ws://127.0.0.1:8000

  # Atlas Charts embed URLs (public, visible in browser anyway)
  NEXT_PUBLIC_ATLAS_CHART_PARTICLE_URL: "https://charts.mongodb.com/charts-jeffn-zsdtj/embed/charts?id=ac775c70-1a0d-44e6-adb2-a1b20f9f7a5b&maxDataAge=10&theme=light&autoRefresh=true"
  NEXT_PUBLIC_ATLAS_CHART_TEMPERATURE_URL: "https://charts.mongodb.com/charts-jeffn-zsdtj/embed/charts?id=ad4f54e1-707e-4c74-89c4-e0d622261ba6&maxDataAge=10&theme=light&autoRefresh=true"
  NEXT_PUBLIC_ATLAS_CHART_RFPOWER_URL: "https://charts.mongodb.com/charts-jeffn-zsdtj/embed/charts?id=ca09b6cb-c40d-4fef-b834-53fb387c9993&maxDataAge=10&theme=light&autoRefresh=true"
  NEXT_PUBLIC_ATLAS_CHART_METRICS_URL: "https://charts.mongodb.com/charts-jeffn-zsdtj/embed/charts?id=3f0e3f1a-e0bd-4de9-ba6c-c59980604a52&maxDataAge=10&theme=light&autoRefresh=true"

sidecarContainers:
  - name: backend
    image: 795250896452.dkr.ecr.us-east-1.amazonaws.com/industrysolutions/smf-yield-defect-backend:latest
    ports:
      - containerPort: 8000
        name: backend

    env:
      # Application environment
      - name: NODE_ENV
        value: staging

      - name: APP_NAME
        value: smf-yield-defect-staging

      - name: DEMO_EXCURSION_PROBABILITY
        value: "0.0"

      - name: DEMO_INTERVAL_SECONDS
        value: "5"

      - name: USE_AI_AGENTS
        value: "true"

      - name: USE_CENTRALIZED_THRESHOLDS
        value: "true"

      # MongoDB connection (from Kubernetes secret)
      - name: MONGODB_URI
        valueFrom:
          secretKeyRef:
            name: smf-yield-secrets-staging
            key: MONGODB_URI

      - name: MDB_DATABASE_NAME
        valueFrom:
          secretKeyRef:
            name: smf-yield-secrets-staging
            key: MDB_DATABASE_NAME

      # Voyage AI API Key (embeddings)
      - name: VOYAGE_API_KEY
        valueFrom:
          secretKeyRef:
            name: smf-yield-secrets-staging
            key: VOYAGE_API_KEY

serviceAccount:
  enabled: true
  irsa:
    accountId: "275662791714"
    roleName: "kanopy-staging-cicd-irsa"




# Kanopy security and ownership (requires web-app chart v4.30.0+)
security:
  dataClassification: "Internal"
  dataDesignation: ["MI"]

ownership:
  driEmail: javier.guajardo@mongodb.com
