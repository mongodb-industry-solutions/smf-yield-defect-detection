---
kind: pipeline
type: kubernetes
name: staging-combined

trigger:
  branch:
    - staging

steps:
  # Step 1: Build and publish backend Docker image
  - name: publish-backend
    image: plugins/kaniko-ecr
    settings:
      create_repository: true
      registry: 795250896452.dkr.ecr.us-east-1.amazonaws.com
      repo: industrysolutions/smf-yield-defect-backend
      dockerfile: Dockerfile.backend
      context: .
      tags:
        - git-${DRONE_COMMIT_SHA:0:7}
        - latest
      access_key:
        from_secret: ecr_access_key
      secret_key:
        from_secret: ecr_secret_key
    when:
      event:
        - push

  # Step 2: Build and publish frontend Docker image
  - name: publish-frontend
    image: plugins/kaniko-ecr
    settings:
      create_repository: true
      registry: 795250896452.dkr.ecr.us-east-1.amazonaws.com
      repo: industrysolutions/smf-yield-defect-frontend
      dockerfile: Dockerfile.frontend
      context: .
      tags:
        - git-${DRONE_COMMIT_SHA:0:7}
        - latest
      build_args:
        - NEXT_PUBLIC_ATLAS_CHART_PARTICLE_URL=https://charts.mongodb.com/charts-jeffn-zsdtj/embed/charts?id=ac775c70-1a0d-44e6-adb2-a1b20f9f7a5b&maxDataAge=10&theme=light&autoRefresh=true
        - NEXT_PUBLIC_ATLAS_CHART_TEMPERATURE_URL=https://charts.mongodb.com/charts-jeffn-zsdtj/embed/charts?id=ad4f54e1-707e-4c74-89c4-e0d622261ba6&maxDataAge=10&theme=light&autoRefresh=true
        - NEXT_PUBLIC_ATLAS_CHART_RFPOWER_URL=https://charts.mongodb.com/charts-jeffn-zsdtj/embed/charts?id=ca09b6cb-c40d-4fef-b834-53fb387c9993&maxDataAge=10&theme=light&autoRefresh=true
        - NEXT_PUBLIC_ATLAS_CHART_METRICS_URL=https://charts.mongodb.com/charts-jeffn-zsdtj/embed/charts?id=3f0e3f1a-e0bd-4de9-ba6c-c59980604a52&maxDataAge=10&theme=light&autoRefresh=true
        # Backend API URLs for Kanopy single-pod deployment (loopback communication)
        - NEXT_PUBLIC_API_URL=/api/backend
        - INTERNAL_API_URL=http://127.0.0.1:8000
        - INTERNAL_WS_URL=ws://127.0.0.1:8000
      access_key:
        from_secret: ecr_access_key
      secret_key:
        from_secret: ecr_secret_key
    when:
      event:
        - push

  # Step 3: Deploy combined pod (frontend + backend sidecar) to Kubernetes
  - name: deploy-combined-staging
    image: public.ecr.aws/kanopy/drone-helm:v3
    settings:
      chart: mongodb/web-app
      chart_version: 4.30.0
      add_repos: [mongodb=https://10gen.github.io/helm-charts]
      namespace: industrysolutions
      release: smf-yield-defect
      values_files: ["environments/staging-combined.yaml"]
      values:
        # Override sidecar backend image with newly built version
        - "sidecarContainers[0].image=795250896452.dkr.ecr.us-east-1.amazonaws.com/industrysolutions/smf-yield-defect-backend:git-${DRONE_COMMIT_SHA:0:7}"
        - "image.tag=git-${DRONE_COMMIT_SHA:0:7}"
        - "image.repository=795250896452.dkr.ecr.us-east-1.amazonaws.com/industrysolutions/smf-yield-defect-frontend"
        - "ingress.enabled=true"
        - "ingress.hosts[0]=smf-yield-defect.industrysolutions.staging.corp.mongodb.com"
        - "mesh.enabled=true"
        # Frontend container resources (reduced based on observed usage)
        - "resources.limits.cpu=500m"
        - "resources.limits.memory=512Mi"
        - "resources.requests.cpu=100m"
        - "resources.requests.memory=256Mi"
        # Backend sidecar resources (reduced based on observed usage)
        - "sidecarContainers[0].resources.limits.cpu=500m"
        - "sidecarContainers[0].resources.limits.memory=512Mi"
        - "sidecarContainers[0].resources.requests.cpu=100m"
        - "sidecarContainers[0].resources.requests.memory=256Mi"
      api_server: https://api.staging.corp.mongodb.com
      kubernetes_token:
        from_secret: staging_kubernetes_token
    when:
      branch:
        - staging
      event:
        - push

---
kind: pipeline
type: kubernetes
name: production-combined

trigger:
  branch:
    - main
  event:
    - push

steps:
  # Step 1: Build and publish backend Docker image
  - name: publish-backend-prod
    image: plugins/kaniko-ecr
    settings:
      create_repository: true
      registry: 795250896452.dkr.ecr.us-east-1.amazonaws.com
      repo: industrysolutions/smf-yield-defect-backend-prod
      dockerfile: Dockerfile.backend
      context: .
      tags:
        - git-${DRONE_COMMIT_SHA:0:7}
        - latest
      access_key:
        from_secret: ecr_access_key
      secret_key:
        from_secret: ecr_secret_key
    when:
      event:
        - push

  # Step 2: Build and publish frontend Docker image
  - name: publish-frontend-prod
    image: plugins/kaniko-ecr
    settings:
      create_repository: true
      registry: 795250896452.dkr.ecr.us-east-1.amazonaws.com
      repo: industrysolutions/smf-yield-defect-frontend-prod
      dockerfile: Dockerfile.frontend
      context: .
      tags:
        - git-${DRONE_COMMIT_SHA:0:7}
        - latest
      build_args:
        - NEXT_PUBLIC_ATLAS_CHART_PARTICLE_URL=https://charts.mongodb.com/charts-jeffn-zsdtj/embed/charts?id=8192c26d-835f-4afa-8b0e-eae66ca0038b&maxDataAge=10&theme=light&autoRefresh=true
        - NEXT_PUBLIC_ATLAS_CHART_TEMPERATURE_URL=https://charts.mongodb.com/charts-jeffn-zsdtj/embed/charts?id=b63f30ea-c1cc-413c-943d-0eb1a968fac2&maxDataAge=10&theme=light&autoRefresh=true
        - NEXT_PUBLIC_ATLAS_CHART_RFPOWER_URL=https://charts.mongodb.com/charts-jeffn-zsdtj/embed/charts?id=65b9b85b-43b5-496d-83a6-d22dc8a5f1e6&maxDataAge=10&theme=light&autoRefresh=true
        - NEXT_PUBLIC_ATLAS_CHART_METRICS_URL=https://charts.mongodb.com/charts-jeffn-zsdtj/embed/charts?id=0d7cbfab-7205-46a0-a012-cef6c2f753ed&maxDataAge=10&theme=light&autoRefresh=true
        # Backend API URLs for Kanopy single-pod deployment (loopback communication)
        - NEXT_PUBLIC_API_URL=/api/backend
        - INTERNAL_API_URL=http://127.0.0.1:8000
        - INTERNAL_WS_URL=ws://127.0.0.1:8000
      access_key:
        from_secret: ecr_access_key
      secret_key:
        from_secret: ecr_secret_key
    when:
      event:
        - push

  # Step 3: Deploy combined pod to production
  - name: deploy-combined-prod
    image: public.ecr.aws/kanopy/drone-helm:v3
    settings:
      chart: mongodb/web-app
      chart_version: 4.30.0
      add_repos: [mongodb=https://10gen.github.io/helm-charts]
      namespace: industrysolutions
      release: smf-yield-defect-prod
      values_files: ["environments/production-combined.yaml"]
      values:
        # Override sidecar backend image with newly built version
        - "sidecarContainers[0].image=795250896452.dkr.ecr.us-east-1.amazonaws.com/industrysolutions/smf-yield-defect-backend-prod:git-${DRONE_COMMIT_SHA:0:7}"
        # Set frontend image (main container)
        - "image.tag=git-${DRONE_COMMIT_SHA:0:7}"
        - "image.repository=795250896452.dkr.ecr.us-east-1.amazonaws.com/industrysolutions/smf-yield-defect-frontend-prod"
        # Ingress configuration
        - "ingress.enabled=true"
        - "ingress.hosts[0]=smf-yield-defect.industrysolutions.prod.corp.mongodb.com"
        # Enable service mesh (Istio)
        - "mesh.enabled=true"
        # Frontend container resources (reduced based on observed usage)
        - "resources.limits.cpu=500m"
        - "resources.limits.memory=512Mi"
        - "resources.requests.cpu=100m"
        - "resources.requests.memory=256Mi"
        # Backend sidecar resources (reduced based on observed usage)
        - "sidecarContainers[0].resources.limits.cpu=500m"
        - "sidecarContainers[0].resources.limits.memory=512Mi"
        - "sidecarContainers[0].resources.requests.cpu=100m"
        - "sidecarContainers[0].resources.requests.memory=256Mi"
      api_server: https://api.prod.corp.mongodb.com
      kubernetes_token:
        from_secret: prod_kubernetes_token
    when:
      branch:
        - main
      event:
        - push
