# Production Environment Configuration - Single Pod Deployment
# Frontend (main container) + Backend (sidecar container)

# ============================================================================
# MAIN CONTAINER (Frontend) Environment Variables
# ============================================================================
env:
  NODE_ENV: production

  # Client-side API calls use Next.js proxy route (runs server-side)
  # The proxy route then uses INTERNAL_API_URL to reach backend via loopback
  NEXT_PUBLIC_API_URL: /api/backend

  # Server-side environment variables for Next.js API routes and rewrites
  # These use loopback because Next.js runs in the same pod as backend
  INTERNAL_API_URL: http://127.0.0.1:8000
  INTERNAL_WS_URL: ws://127.0.0.1:8000

# ============================================================================
# MAIN CONTAINER (Frontend) Secrets
# ============================================================================
envSecrets:
  # No frontend-specific secrets needed currently
  # Add here if needed for production

# ============================================================================
# SIDECAR CONTAINER (Backend) Configuration
# ============================================================================
sidecarContainers:
  - name: backend
    # Image will be overridden by Drone pipeline with specific git SHA tag
    image: 795250896452.dkr.ecr.us-east-1.amazonaws.com/industrysolutions/smf-yield-defect-backend-prod:latest

    # Expose backend port (must listen on 0.0.0.0 in Dockerfile)
    ports:
      - containerPort: 8000
        name: backend
        protocol: TCP

    # Backend environment variables
    env:
      # Application environment
      - name: NODE_ENV
        value: production

      - name: APP_NAME
        value: smf-yield-defect-production

      - name: DEMO_MODE_ENABLED
        value: "false"  # Disable demo mode in production

      - name: DEMO_INTERVAL_SECONDS
        value: "60"

      - name: USE_AI_AGENTS
        value: "true"

      - name: USE_CENTRALIZED_THRESHOLDS
        value: "true"

      # MongoDB connection (from Kubernetes secret)
      - name: MONGODB_URI
        valueFrom:
          secretKeyRef:
            name: smf-yield-secrets-prod
            key: MONGODB_URI

      - name: MDB_DATABASE_NAME
        valueFrom:
          secretKeyRef:
            name: smf-yield-secrets-prod
            key: MDB_DATABASE_NAME

      # Voyage AI API Key (embeddings)
      - name: VOYAGE_API_KEY
        valueFrom:
          secretKeyRef:
            name: smf-yield-secrets-prod
            key: VOYAGE_API_KEY

      # AWS Credentials (optional - for S3 image storage)
      # If using IRSA, these are not needed
      - name: AWS_REGION
        value: us-east-1

      # Uncomment if NOT using IRSA:
      # - name: AWS_ACCESS_KEY_ID
      #   valueFrom:
      #     secretKeyRef:
      #       name: smf-yield-secrets-prod
      #       key: AWS_ACCESS_KEY_ID

      # - name: AWS_SECRET_ACCESS_KEY
      #   valueFrom:
      #     secretKeyRef:
      #       name: smf-yield-secrets-prod
      #       key: AWS_SECRET_ACCESS_KEY

      # - name: S3_BUCKET_URI
      #   valueFrom:
      #     secretKeyRef:
      #       name: smf-yield-secrets-prod
      #       key: S3_BUCKET_URI

    # Backend resource limits (higher for production)
    resources:
      limits:
        memory: 2Gi
        cpu: 1000m
      requests:
        memory: 1Gi
        cpu: 500m

# ============================================================================
# Service Account Configuration (Optional - for AWS IRSA)
# ============================================================================
# Uncomment if using AWS IAM Roles for Service Accounts (IRSA)
# serviceAccount:
#   enabled: true
#   irsa:
#     accountId: "795250896452"
#     roleName: "kanopy-prod-cicd-irsa"

# ============================================================================
# Health Probes
# ============================================================================
# Frontend health check - Kanopy will probe this endpoint
probes:
  enabled: true
  path: /api/health  # Frontend health endpoint
  liveness:
    httpGet: true
    initialDelaySeconds: 30
    periodSeconds: 30
    timeoutSeconds: 5
    failureThreshold: 3
  readiness:
    httpGet: true
    initialDelaySeconds: 20
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3

# ============================================================================
# Services Configuration
# ============================================================================
services:
  - name: http
    port: 8080
    targetPort: 8080  # Frontend runs on 8080 (Kanopy standard)
    ingress: true
    probes: true
    protocol: TCP
    type: ClusterIP
